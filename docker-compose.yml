services:
  db:
    image: postgres:17
    container_name: task-management-postgres
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: task-management-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Task Management API
      APP_VERSION: 1.0.0
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://taskapp:taskapp_password@db:5432/taskdb
      JWT_SECRET_KEY: change-this-development-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"

volumes:
  postgres_data:
